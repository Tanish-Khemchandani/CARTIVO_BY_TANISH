services:
  - type: web
    name: cartivo
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_EMAIL
        value: demo.manager@cartivo.local
      - key: DEMO_MANAGER_PASSWORD
        value: CartivoDemo2026!
      - key: VITE_API_URL
        value: /api
